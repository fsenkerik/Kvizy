<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz: Soubory, složky a OneDrive</title>
<style>
  :root {
    --purple: #6A4C93;
    --purple-dark: #4A3468;
    --teal: #1B998B;
    --orange: #F4A261;
    --ink: #2B2B2B;
    --muted: #6B6B6B;
    --panel: #F5F1FA;
    --green-bg: #C6EFCE;
    --green-fg: #006100;
    --red-bg: #FFC7CE;
    --red-fg: #9C0006;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    background: #FAFAFC;
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header {
    background: var(--purple);
    color: #fff;
    border-radius: 16px;
    padding: 28px 28px 24px;
    margin-bottom: 28px;
  }
  header .kicker {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 13px;
    font-weight: bold;
    color: var(--orange);
  }
  header h1 { margin: 8px 0 4px; font-size: 26px; }
  header p { margin: 0; opacity: 0.9; font-size: 14px; }
  .question {
    background: #fff;
    border: 1px solid #e6e0ef;
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .qhead {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .qnum {
    flex: 0 0 auto;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--teal);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px;
  }
  .qtext { font-weight: bold; font-size: 16px; line-height: 1.4; padding-top: 4px; }
  .qtype { font-size: 12px; font-weight: normal; color: var(--muted); display: block; margin-top: 2px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  label.opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1.5px solid #e0dae8;
    border-radius: 10px;
    cursor: pointer;
    background: var(--panel);
    font-size: 14.5px;
    transition: border-color .15s;
  }
  label.opt:hover { border-color: var(--purple); }
  label.opt input { accent-color: var(--purple); width: 16px; height: 16px; flex: 0 0 auto; }
  .explain {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    display: none;
    line-height: 1.4;
  }
  .question.correct { border-color: var(--teal); }
  .question.incorrect { border-color: #e08a91; }
  .question.correct label.opt.was-selected { background: var(--green-bg); border-color: var(--green-fg); color: var(--green-fg); }
  .question.incorrect label.opt.was-selected { background: var(--red-bg); border-color: var(--red-fg); color: var(--red-fg); }
  .question.graded label.opt.is-answer:not(.was-selected) { background: var(--green-bg); border-color: var(--green-fg); }
  .question.graded .explain { display: block; }
  .question.correct .explain { background: var(--green-bg); color: var(--green-fg); }
  .question.incorrect .explain { background: var(--red-bg); color: var(--red-fg); }
  .actions { text-align: center; margin: 30px 0; }
  button {
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--purple-dark); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result {
    display: none;
    background: var(--panel);
    border-radius: 16px;
    padding: 26px 28px;
    text-align: center;
    margin-top: 10px;
  }
  #result .score { font-size: 40px; font-weight: bold; color: var(--purple-dark); }
  #result .verdict { font-size: 17px; margin-top: 6px; color: var(--ink); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: -10px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Informatika · Prima</div>
    <h1>Kvíz: Soubory, složky a OneDrive</h1>
    <p>Zkontroluj si, co sis zapamatoval/a z dnešní dvouhodinovky. U otázky č. 4 je správných odpovědí víc.</p>
  </header>

  <div id="quiz"></div>

  <div class="actions">
    <button id="submitBtn" onclick="gradeQuiz()">Vyhodnotit kvíz</button>
  </div>

  <div id="result">
    <div class="score" id="scoreText"></div>
    <div class="verdict" id="verdictText"></div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type: 'single',
    text: 'Co nejlépe vystihuje, k čemu slouží složka?',
    options: [
      'Slouží k uspořádání souborů a dalších složek',
      'Je to typ souboru s příponou .docx',
      'Nelze do ní nic uložit',
      'Automaticky se maže po vypnutí počítače'
    ],
    correct: [0],
    explain: 'Složka funguje jako pořadač – nic v ní přímo není napsáno, ale schováváš do ní soubory a další složky, aby v tom byl pořádek.'
  },
  {
    type: 'boolean',
    text: 'Novou složku můžeš rychle vytvořit klávesovou zkratkou Ctrl + Shift + N.',
    options: ['Pravda', 'Nepravda'],
    correct: [0],
    explain: 'Přesně tak – tato zkratka vytvoří novou složku přímo z klávesnice, bez klikání pravým tlačítkem.'
  },
  {
    type: 'single',
    text: 'Na školním počítači si změníš ikonu své složky. Co se stane?',
    options: [
      'Automaticky se nahraje na OneDrive',
      'Změna se objeví na všech počítačích ve třídě',
      'Ikona zůstane jiná jen na tomto konkrétním počítači',
      'Změna se ztratí hned po restartu počítače'
    ],
    correct: [2],
    explain: 'Nastavení vzhledu se neukládá do samotné složky, ale do daného zařízení – na jiném počítači uvidíš zase původní ikonu.'
  },
  {
    type: 'multi',
    text: 'Které z těchto tvrzení o OneDrivu jsou pravdivá? (může být víc správných odpovědí)',
    options: [
      'Je to úložiště dat v cloudu (na internetu)',
      'Přihlásíš se do něj svým školním účtem',
      'Soubory v něm vidíš jen na jednom konkrétním počítači',
      'Jde otevřít i z webového prohlížeče'
    ],
    correct: [0, 1, 3],
    explain: 'OneDrive je cloudové úložiště, do kterého se přihlašuješ školním účtem a dostaneš se k němu z libovolného počítače nebo telefonu – nejen z jednoho zařízení.'
  },
  {
    type: 'single',
    text: 'Jak se přihlásíš do OneDrivu z webového prohlížeče?',
    options: [
      'Musíš si stáhnout speciální aplikaci do telefonu',
      'Přihlášení z webu vůbec není možné',
      'Stačí zapnout počítač, přihlášení proběhne samo',
      'Otevřeš onedrive.com nebo office.com a přihlásíš se účtem'
    ],
    correct: [3],
    explain: 'Na onedrive.com nebo office.com se přihlásíš školním e-mailem a heslem – funguje to na jakémkoli počítači i telefonu, nic se neinstaluje.'
  },
  {
    type: 'boolean',
    text: 'Ikonu souboru nebo složky nejde nijak změnit, vždy zůstává úplně stejná.',
    options: ['Pravda', 'Nepravda'],
    correct: [1],
    explain: 'Ikonu složky lze změnit přes Vlastnosti → Přizpůsobit → Změnit ikonu, případně si lze stáhnout i vlastní ikonu z webu.'
  },
  {
    type: 'single',
    text: 'Chceš poslat stejnou zprávu celé třídě najednou, aniž bys vypisoval/a každé jméno zvlášť. Co použiješ?',
    options: [
      'Musíš napsat tolik e-mailů, kolik je spolužáků',
      'Vytvoříš skupinu kontaktů a napíšeš zprávu jí',
      'To v e-mailu vůbec nejde',
      'Pošleš to jen jednomu a požádáš ho o přeposlání'
    ],
    correct: [1],
    explain: 'Ve skupinách v e-mailu (Outlooku) vytvoříš skupinu, přidáš do ní spolužáky a od té chvíle stačí napsat zprávu skupině – dostanou ji všichni najednou.'
  },
  {
    type: 'single',
    text: 'V Teams chceš chatovat zároveň s několika spolužáky. Co k tomu použiješ?',
    options: [
      'Přílohu e-mailu',
      'Vlastní ikonu složky',
      'Skupinový chat',
      'Kompresi souboru (ZIP)'
    ],
    correct: [2],
    explain: 'Přes „Nová zpráva“ a pojmenování skupiny v poli „Komu“ založíš skupinový chat, do kterého může psát kdokoli z účastníků.'
  }
];

const quizEl = document.getElementById('quiz');

QUESTIONS.forEach((q, qi) => {
  const div = document.createElement('div');
  div.className = 'question';
  div.id = 'q' + qi;

  const typeLabel = q.type === 'multi' ? 'Vyber všechny správné odpovědi' : (q.type === 'boolean' ? 'Pravda, nebo nepravda?' : 'Vyber jednu odpověď');
  const inputType = q.type === 'multi' ? 'checkbox' : 'radio';

  let optsHtml = '<div class="options">';
  q.options.forEach((opt, oi) => {
    optsHtml += `<label class="opt" data-oi="${oi}">
      <input type="${inputType}" name="q${qi}" value="${oi}">
      <span>${opt}</span>
    </label>`;
  });
  optsHtml += '</div>';

  div.innerHTML = `
    <div class="qhead">
      <div class="qnum">${qi + 1}</div>
      <div class="qtext">${q.text}<span class="qtype">${typeLabel}</span></div>
    </div>
    ${optsHtml}
    <div class="explain" id="explain${qi}"></div>
  `;
  quizEl.appendChild(div);
});

function gradeQuiz() {
  let correctCount = 0;

  QUESTIONS.forEach((q, qi) => {
    const div = document.getElementById('q' + qi);
    const inputs = div.querySelectorAll('input');
    const selected = Array.from(inputs).filter(i => i.checked).map(i => parseInt(i.value));
    const isCorrect = selected.length === q.correct.length && selected.every(v => q.correct.includes(v));

    if (isCorrect) correctCount++;

    div.classList.add('graded', isCorrect ? 'correct' : 'incorrect');
    inputs.forEach(inp => inp.disabled = true);

    div.querySelectorAll('label.opt').forEach(label => {
      const oi = parseInt(label.dataset.oi);
      if (selected.includes(oi)) label.classList.add('was-selected');
      if (q.correct.includes(oi)) label.classList.add('is-answer');
    });

    document.getElementById('explain' + qi).textContent =
      (isCorrect ? '✓ Správně. ' : '✗ Nesprávně. ') + q.explain;
  });

  const pct = Math.round((correctCount / QUESTIONS.length) * 100);
  document.getElementById('scoreText').textContent = correctCount + ' / ' + QUESTIONS.length + ' (' + pct + ' %)';

  let verdict;
  if (pct === 100) verdict = 'Skvělé! Vše sedí, látku máš zvládnutou na jedničku.';
  else if (pct >= 75) verdict = 'Moc dobré! Jen pár věcí si ještě zopakuj.';
  else if (pct >= 50) verdict = 'Dobrý základ, ale některým tématům je dobré se ještě věnovat.';
  else verdict = 'Doporučujeme si prezentaci ještě jednou projít a kvíz zkusit znovu.';

  document.getElementById('verdictText').textContent = verdict;
  document.getElementById('result').style.display = 'block';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>
</body>
</html>
